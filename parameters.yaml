# Run with:  python agent.py <section name> --train

flappybird1:
  env_id: FlappyBird-v0
  env_make_params:
    use_lidar: False      # 12 simple numbers instead of 180 lidar rays
  replay_memory_size: 100000
  mini_batch_size: 32
  epsilon_init: 1.0
  epsilon_decay: 0.995
  epsilon_min: 0.01
  network_sync_rate: 1000
  learning_rate: 0.0001
  discount_factor: 0.99
  hidden_dim: 256
  stop_on_reward: 1000
